name: Static Analysis

on:
  workflow_call:
    inputs:
      php-version:
        description: 'PHP version'
        required: false
        type: string
        default: '["8.3", "8.4"]'
      extensions:
        description: 'PHP extensions to install'
        required: false
        type: string
        default: 'dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo'
      ini-values:
        description: 'php.ini values to set (csv, e.g. post_max_size=256M, max_execution_time=180)'
        required: false
        type: string
        default: ''
      add-org-packagist:
        description: 'Should add kodamity org packagist'
        required: false
        type: boolean
        default: false
    secrets:
      composer-auth-json:
        description: 'Composer auth.json content'
        required: false

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        php: ${{ fromJson(inputs.php-version) }}
    name: PHP ${{ matrix.php }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        env:
          COMPOSER_AUTH_JSON: ${{ secrets.composer-auth-json }}
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ inputs.extensions }}
          ini-values: ${{ inputs.ini-values }}
          coverage: none

      - name: Add Organization Package Repository
        if: ${{ inputs.add-org-packagist }}
        run: composer config repositories.kodamity composer "https://packagist.kodamity.dev"

      - name: Install composer dependencies
        uses: ramsey/composer-install@v4

      - name: Execute static analysis
        run: ./vendor/bin/phpstan --error-format=github