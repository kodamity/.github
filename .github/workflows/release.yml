name: Release

on:
  workflow_call:
    inputs:
      bump:
        description: 'Which part of the version to bump: patch, minor or major'
        required: false
        type: string
        default: patch
      branch:
        description: 'Target branch'
        required: false
        type: string
        default: main
      tag-prefix:
        description: 'Tag prefix (e.g. "v")'
        required: false
        type: string
        default: v
      cliff-config-ref:
        description: 'Git ref of kodamity/.github to fetch default cliff.toml from'
        required: false
        type: string
        default: main

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.branch }}

      - name: Fail on an open draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          DRAFT=$(gh release list --limit 20 --json isDraft,tagName --jq 'map(select(.isDraft)) | first | .tagName // ""')
          if [ -n "$DRAFT" ]; then
            echo "::error::Draft release $DRAFT is still open. Publish or delete it before preparing a new one."
            exit 1
          fi

      - name: Compute next version
        id: ver
        env:
          BUMP: ${{ inputs.bump }}
          PREFIX: ${{ inputs.tag-prefix }}
        run: |
          set -euo pipefail
          case "$BUMP" in
            patch|minor|major) ;;
            *) echo "::error::Invalid bump '$BUMP'. Expected patch, minor or major."; exit 1 ;;
          esac
          last=$(git tag -l "${PREFIX}*" --sort=-v:refname | grep -E "^${PREFIX}[0-9]+\.[0-9]+\.[0-9]+$" | head -1 || true)
          if [ -n "$last" ] && [ -z "$(git log "${last}..HEAD" --no-merges --oneline | head -1)" ]; then
            echo "::notice::No commits since ${last} — nothing to release"
            echo "next=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [ -n "$last" ] || last="${PREFIX}0.0.0"
          IFS=. read -r MAJOR MINOR PATCH <<<"${last#"$PREFIX"}"
          case "$BUMP" in
            major) next="${PREFIX}$((MAJOR + 1)).0.0" ;;
            minor) next="${PREFIX}${MAJOR}.$((MINOR + 1)).0" ;;
            patch) next="${PREFIX}${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
          esac
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "last=$last next=$next"

      - name: Fetch default cliff.toml if absent
        if: ${{ steps.ver.outputs.next != '' }}
        env:
          REF: ${{ inputs.cliff-config-ref }}
        run: |
          if [ ! -f cliff.toml ]; then
            curl -sSLf -o cliff.toml \
              "https://raw.githubusercontent.com/kodamity/.github/$REF/cliff.toml"
          fi

      - name: Initialize CHANGELOG.md if absent or empty
        if: ${{ steps.ver.outputs.next != '' }}
        run: |
          if [ ! -s CHANGELOG.md ]; then
            printf '# Changelog\n\nAll notable changes to this project will be documented in this file.\n\n' > CHANGELOG.md
          fi

      - name: Generate new changelog section
        if: ${{ steps.ver.outputs.next != '' }}
        id: cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --unreleased --tag ${{ steps.ver.outputs.next }}

      - name: Insert new section into CHANGELOG.md
        if: ${{ steps.ver.outputs.next != '' }}
        env:
          NEW_CONTENT: ${{ steps.cliff.outputs.content }}
        run: |
          SPLIT_LINE=$(grep -n '^## ' CHANGELOG.md | head -1 | cut -d: -f1 || true)
          if [ -z "$SPLIT_LINE" ]; then
            printf '%s\n' "$NEW_CONTENT" >> CHANGELOG.md
          else
            {
              head -n $((SPLIT_LINE - 1)) CHANGELOG.md
              printf '%s\n' "$NEW_CONTENT"
              tail -n +$SPLIT_LINE CHANGELOG.md
            } > CHANGELOG.md.tmp
            mv CHANGELOG.md.tmp CHANGELOG.md
          fi

      - name: Commit CHANGELOG
        if: ${{ steps.ver.outputs.next != '' }}
        id: commit
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          branch: ${{ inputs.branch }}
          commit_message: "chore(release): ${{ steps.ver.outputs.next }}"
          file_pattern: CHANGELOG.md

      - name: Create draft release
        if: ${{ steps.ver.outputs.next != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.next }}
          NOTES: ${{ steps.cliff.outputs.content }}
          TARGET: ${{ steps.commit.outputs.commit_hash }}
        run: |
          gh release create "$TAG" --draft --target "$TARGET" --title "$TAG" --notes "$NOTES"
          echo "::notice::Draft $TAG created — publish it by hand to create the tag and release the package"
