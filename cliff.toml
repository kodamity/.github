# Reference cliff.toml for kodamity/.github reusable release workflow.
# Auto-fetched at workflow runtime if consumer repo has no local cliff.toml.

[changelog]
header = ""
body = """
{% if version %}\
    ## v{{ version | trim_start_matches(pat="v") }} - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}{{ commit.message | upper_first }}\
    {% endfor %}
{% endfor %}
{% if previous and previous.version %}
**Full Changelog**: https://github.com/{{ get_env(name="GITHUB_REPOSITORY") }}/compare/{{ previous.version }}...{{ version }}
{% endif %}\n
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
commit_parsers = [
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Bug Fixes" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Refactor" },
    { message = "^docs", group = "Documentation" },
    { message = "^test", group = "Tests" },
    { message = "^ci", group = "CI" },
    { message = "^build", group = "Build" },
    { message = "^chore\\(release\\)", skip = true },
    { message = "^chore", group = "Chores" },
    { message = "^style", skip = true },
    { message = "^revert", group = "Reverts" },
]
filter_commits = false
tag_pattern = "v?[0-9].*"
sort_commits = "newest"
